name: Build MIO camera-roll 001 public asset

on:
  push:
    branches: [main]
    paths:
      - "ops/mio-camera-roll-001-sources.json"
      - ".github/workflows/build-mio-camera-roll-001.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mio-camera-roll-001
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download three source moments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mio-camera-roll-001
          python - <<'PY'
          import json, pathlib
          d=json.load(open("ops/mio-camera-roll-001-sources.json"))
          p=pathlib.Path("/tmp/mio-camera-roll-001")
          for i,u in enumerate(d["urls"],1):
              (p/f"url-{i}.txt").write_text(u)
          PY
          for N in 1 2 3; do
            curl --fail --location --retry 3 --silent --show-error               "$(cat /tmp/mio-camera-roll-001/url-$N.txt)"               -o "/tmp/mio-camera-roll-001/shot-$N.jpg"
            test -s "/tmp/mio-camera-roll-001/shot-$N.jpg"
          done

      - name: Build six-second camera-roll clip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/camera-roll-v3
          ffmpeg -hide_banner -loglevel warning -y             -loop 1 -framerate 30 -t 2 -i /tmp/mio-camera-roll-001/shot-1.jpg             -loop 1 -framerate 30 -t 2 -i /tmp/mio-camera-roll-001/shot-2.jpg             -loop 1 -framerate 30 -t 2 -i /tmp/mio-camera-roll-001/shot-3.jpg             -filter_complex "[0:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2+4*sin(4*t)':y='(ih-oh)/2+3*sin(3*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v0];[1:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2-3*sin(3*t)':y='(ih-oh)/2+4*sin(4*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v1];[2:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2+4*sin(5*t)':y='(ih-oh)/2-3*sin(2*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v2];[v0][v1][v2]concat=n=3:v=1:a=0,fps=30,settb=1/30,setpts=N,format=yuv420p[v]"             -map "[v]" -an -t 6 -r 30 -fps_mode cfr             -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p             -movflags +faststart -map_metadata -1             media/camera-roll-v3/mio-camera-roll-001.mp4

      - name: QC and make cover
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size             -show_entries stream=codec_name,width,height,r_frame_rate             -of json media/camera-roll-v3/mio-camera-roll-001.mp4 > /tmp/probe.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/probe.json"))
          dur=float(d["format"]["duration"]); size=int(d["format"]["size"])
          v=next(s for s in d["streams"] if s.get("codec_name")=="h264")
          assert 5.9 <= dur <= 6.1
          assert (int(v["width"]),int(v["height"])) == (1080,1920)
          assert v["r_frame_rate"] == "30/1"
          assert 10_000 < size < 95_000_000
          PY
          ffmpeg -hide_banner -loglevel warning -y -ss 0.25             -i media/camera-roll-v3/mio-camera-roll-001.mp4             -frames:v 1 -q:v 2 media/camera-roll-v3/mio-camera-roll-001-cover.jpg
          test -s media/camera-roll-v3/mio-camera-roll-001-cover.jpg

      - name: Commit durable public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/camera-roll-v3/mio-camera-roll-001.mp4                   media/camera-roll-v3/mio-camera-roll-001-cover.jpg
          if git diff --cached --quiet; then
            echo "Public assets already current."
            exit 0
          fi
          git commit -m "Add MIO camera-roll 001 public assets"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
