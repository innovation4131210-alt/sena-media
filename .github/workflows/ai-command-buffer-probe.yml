name: Probe AI Command Buffer channel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-command-buffer-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
      DMM_BUFFER_API_KEY: ${{ secrets.DMM_BUFFER_API_KEY }}
    steps:
      - name: Probe existing Buffer secrets for ai_command_jp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          API = "https://api.buffer.com"
          TARGET = "ai_command_jp"

          def gql(key, query):
              req = urllib.request.Request(
                  API,
                  data=json.dumps({"query": query}).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {key}",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode())
              if data.get("errors"):
                  raise RuntimeError(data["errors"])
              return data["data"]

          def q(s):
              return json.dumps(s)

          def has_target(key):
              if not key:
                  return "secret-missing"
              try:
                  orgs = gql(key, "query { account { organizations { id name } } }")["account"]["organizations"]
                  for org in orgs:
                      query = f"""query {{
                        channels(input: {{ organizationId: {q(org["id"])} }}) {{
                          id name service
                        }}
                      }}"""
                      channels = gql(key, query)["channels"]
                      for ch in channels:
                          name = (ch.get("name") or "").lower().replace("@", "")
                          if ch.get("service") == "twitter" and TARGET in name:
                              return "yes"
                  return "no"
              except Exception as e:
                  return "api-error"

          print("X_BUFFER_API_KEY_match=" + has_target(os.getenv("X_BUFFER_API_KEY","")))
          print("DMM_BUFFER_API_KEY_match=" + has_target(os.getenv("DMM_BUFFER_API_KEY","")))
          PY
