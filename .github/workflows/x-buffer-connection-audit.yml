name: X Buffer read-only connection audit

on:
  push:
    branches: [main]
    paths:
      - "ops/x-buffer-connection-audit-trigger.txt"
      - ".github/workflows/x-buffer-connection-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read X-only Buffer channels without mutation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const endpoint="https://api.buffer.com";
          const key=process.env.X_BUFFER_API_KEY;
          if(!key) throw new Error("X_BUFFER_API_KEY missing");
          async function gql(query,variables={}){
            const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${key}`},body:JSON.stringify({query,variables}),signal:AbortSignal.timeout(30000)});
            const j=await r.json();
            if(!r.ok||j.errors?.length) throw new Error(JSON.stringify(j.errors??j));
            return j.data;
          }
          async function inventory(orgId,channelId){
            const d=await gql(`query($organizationId:OrganizationId!,$channelId:ChannelId!){posts(first:100,input:{organizationId:$organizationId,filter:{channelIds:[$channelId]},sort:[{field:dueAt,direction:asc}]}){edges{node{id text status dueAt sentAt externalLink channelId}}pageInfo{hasNextPage}}}`,{organizationId:orgId,channelId});
            if(d.posts?.pageInfo?.hasNextPage) throw new Error("Incomplete inventory for "+channelId);
            return (d.posts?.edges??[]).map(e=>e.node);
          }
          const acc=await gql("query { account { organizations { id name } } }");
          const channels=[];
          for(const org of acc.account?.organizations??[]){
            const d=await gql(`query($organizationId:OrganizationId!){channels(input:{organizationId:$organizationId}){id name displayName service isQueuePaused isDisconnected isLocked}}`,{organizationId:org.id});
            for(const c of d.channels??[]){
              if(!["twitter","x"].includes(String(c.service).toLowerCase())) continue;
              const posts=await inventory(org.id,c.id);
              const counts=posts.reduce((a,p)=>(a[p.status]=(a[p.status]||0)+1,a),{});
              channels.push({
                organizationId:org.id,
                organizationName:org.name,
                id:c.id,
                name:c.name,
                displayName:c.displayName,
                service:c.service,
                isQueuePaused:c.isQueuePaused,
                isDisconnected:c.isDisconnected,
                isLocked:c.isLocked,
                counts,
                recent:posts.slice(-8).map(p=>({id:p.id,status:p.status,dueAt:p.dueAt,sentAt:p.sentAt,externalLink:p.externalLink,text:(p.text||"").slice(0,120)}))
              });
            }
          }
          const out={version:1,checkedAt:new Date().toISOString(),readOnly:true,channels};
          fs.mkdirSync("analytics",{recursive:true});
          fs.writeFileSync("analytics/x-buffer-connection-audit.json",JSON.stringify(out,null,2)+"\n");
          console.log(JSON.stringify({checkedAt:out.checkedAt,channels:channels.map(c=>({id:c.id,name:c.name,displayName:c.displayName,service:c.service,counts:c.counts,isDisconnected:c.isDisconnected,isLocked:c.isLocked,isQueuePaused:c.isQueuePaused}))},null,2));
          NODE
      - name: Persist credential-free audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/x-buffer-connection-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record X-only Buffer connection audit"
          git pull --rebase origin main
          git push
