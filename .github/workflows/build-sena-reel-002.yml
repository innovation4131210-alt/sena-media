name: Build SENA reel replication 002

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sena-reel-002.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build paired Reel from durable SENA static source
        shell: bash
        run: |
          set -e
          test -s media/sena-003.jpg
          ffmpeg -hide_banner -loglevel warning -y -loop 1 -i media/sena-003.jpg             -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=30[bg];[0:v]scale=980:-2[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,zoompan=z='min(zoom+0.00025,1.035)':d=180:s=1080x1920:fps=30[v]"             -map "[v]" -t 6 -an -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart             media/sena-reel-format-test-002.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json media/sena-reel-format-test-002.mp4
          SIZE=$(stat -c%s media/sena-reel-format-test-002.mp4)
          test "$SIZE" -gt 10000
          test "$SIZE" -lt 95000000
      - name: Commit durable paired Reel
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/sena-reel-format-test-002.mp4
          if git diff --cached --quiet; then
            echo "Asset unchanged."
            exit 0
          fi
          git commit -m "Add SENA paired Reel replication 002"
          git pull --rebase origin main
          git push
