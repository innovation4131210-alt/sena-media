name: Apply AI Command X R.E.I. voice batches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/ai-command-x/rei_voice_batches/*.json"
      - "automation/ai-command-x/apply_rei_voice_batches.py"
      - ".github/workflows/ai-command-x-apply-rei-voice.yml"

permissions:
  contents: write

concurrency:
  group: ai-command-x-apply-rei-voice
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R.E.I. voice batches
        run: python3 automation/ai-command-x/apply_rei_voice_batches.py
      - name: Persist posts.json
        shell: bash
        run: |
          if git diff --quiet -- automation/ai-command-x/posts.json; then
            echo "posts.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ai-command-x/posts.json
          git commit -m "Apply R.E.I. voice batches"
          git pull --rebase origin main
          git push
