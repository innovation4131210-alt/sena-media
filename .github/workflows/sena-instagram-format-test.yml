name: SENA Instagram format test

on:
  push:
    branches: [main]
    paths:
      - "automation/sena-launch/format-test-2026-09-26.json"
      - "scripts/sena-instagram-format-test.mjs"
      - ".github/workflows/sena-instagram-format-test.yml"

permissions:
  contents: write

concurrency:
  group: sena-instagram-format-test
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENA_BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
      SENA_IG_FORMAT_TEST_MANIFEST: automation/sena-launch/format-test-2026-09-26.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: node --check scripts/sena-instagram-format-test.mjs
      - name: Replace one static reservation with Reel
        run: node scripts/sena-instagram-format-test.mjs
      - name: Persist verified state
        shell: bash
        run: |
          if git diff --quiet -- automation/sena-launch/format-test-2026-09-26.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/sena-launch/format-test-2026-09-26.json
          git commit -m "Verify SENA Instagram Reel format test"
          git pull --rebase origin main
          git push
