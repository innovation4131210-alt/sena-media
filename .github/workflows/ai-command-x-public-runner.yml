name: AI Command X public Buffer refill

on:
  workflow_dispatch:
  schedule:
    - cron: "5 15 * * *" # 00:05 JST
  push:
    branches: [main]
    paths:
      - "automation/ai-command-x/posts.json"
      - "automation/ai-command-x/buffer_queue.py"
      - ".github/workflows/ai-command-x-public-runner.yml"

permissions:
  contents: write

concurrency:
  group: ai-command-x-public-runner
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refill AI Command X Buffer queue
        id: refill
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
          BUFFER_CHANNEL_HINT: ai_command_jp
          TARGET_QUEUE_SIZE: "9"
        run: python3 automation/ai-command-x/buffer_queue.py

      - name: Persist AI Command queue state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- automation/ai-command-x/state.json; then
            echo "Queue state did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ai-command-x/state.json
          git commit -m "Refill AI Command X Buffer queue"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt/3); retrying."
            sleep $((attempt * 2))
          done
          echo "Failed to persist generated state after 3 attempts."
          exit 1

      - name: Fail if scheduler failed
        if: steps.refill.outcome == 'failure'
        run: exit 1
