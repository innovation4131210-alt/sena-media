name: MIO SENA read-only connection audit
# Reconcile live scheduler inventories after the Sep 24 continuation check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mio-sena-connection-audit.yml
      - scripts/mio-sena-connection-audit.mjs
      - scripts/test-mio-sena-connection-audit.mjs
permissions:
  contents: write
concurrency:
  group: mio-sena-connection-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test read-only and secret-redaction guards
        run: |
          node --check scripts/mio-sena-connection-audit.mjs
          node scripts/test-mio-sena-connection-audit.mjs
      - name: Read connections and delivery status without posting
        env:
          MIO_BUFFER_API_KEY: ${{ secrets.MIO_BUFFER_API_KEY }}
          SENA_BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
        run: node scripts/mio-sena-connection-audit.mjs
      - name: Persist credential-free diagnostics
        if: always()
        run: |
          test -f analytics/mio-sena-connection-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/mio-sena-connection-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record MIO SENA read-only connection audit"
          git pull --rebase origin main
          git push

