name: SENA Threads refill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/sena-threads/queue.json"
      - "scripts/sena-threads-refill.mjs"
      - ".github/workflows/sena-threads-refill.yml"

permissions:
  contents: write

concurrency:
  group: sena-threads-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SENA_BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate scheduler syntax
        run: node --check scripts/sena-threads-refill.mjs
      - name: Refill SENA Threads queue when enabled
        run: node scripts/sena-threads-refill.mjs
      - name: Persist verified queue state
        shell: bash
        run: |
          if git diff --quiet -- automation/sena-threads/queue.json; then
            echo "Queue state did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/sena-threads/queue.json
          git commit -m "Refill SENA Threads queue"
          git pull --rebase origin main
          git push
