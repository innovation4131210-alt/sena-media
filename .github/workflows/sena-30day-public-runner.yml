name: Schedule SENA 30-day feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "media/sena-30day-2026-09-28/**"

permissions:
  contents: write

concurrency:
  group: sena-30day-feed
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact 30 media
        shell: bash
        run: |
          set -e
          test -d media/sena-30day-2026-09-28
          test "$(find media/sena-30day-2026-09-28 -maxdepth 1 -type f | wc -l)" -eq 30
      - name: Verify SENA secret
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
        run: test -n "$BUFFER_API_KEY"
      - name: Schedule SENA 30-day feed
        env:
          BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
        run: node scripts/sena-30day-public-runner.mjs
      - name: Persist verified state
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/30day/sena-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist SENA 30-day Buffer schedule"
          git pull --rebase origin main
          git push
