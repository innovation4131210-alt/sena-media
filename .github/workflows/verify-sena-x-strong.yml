name: Verify SENA X strong post media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-sena-x-strong.mjs"
      - ".github/workflows/verify-sena-x-strong.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-sena-x-strong.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/sena-x-strong-readback.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify SENA X strong post media"
          git pull --rebase origin main
          git push
