name: Audit MIO Instagram Buffer free channel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-mio-instagram-buffer.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: node --check scripts/audit-mio-instagram-buffer.mjs
      - run: node --check scripts/mio-instagram-overflow.mjs
      - name: Read MIO Instagram queue with configured key
        env:
          BUFFER_API_KEY: ${{ secrets.MIO_BUFFER_API_KEY }}
        run: node scripts/audit-mio-instagram-buffer.mjs
