name: Inspect Buffer Instagram schema

on:
  push:
    branches: [main]
    paths:
      - "ops/inspect-buffer-instagram-schema.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant input types
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = "https://api.buffer.com";
          const key = process.env.BUFFER_API_KEY;
          if (!key) throw new Error("missing key");
          async function gql(query, variables={}) {
            const r = await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${key}`},body:JSON.stringify({query,variables})});
            const j = await r.json();
            if (!r.ok || j.errors) throw new Error(JSON.stringify(j.errors||j));
            return j.data;
          }
          const q = `query($name:String!){__type(name:$name){name kind inputFields{name type{kind name ofType{kind name ofType{kind name}}}} enumValues{name}}}`;
          const names=["CreatePostInput","AssetInput","ImageAssetInput","VideoAssetInput","VideoMetadataInput","PostInputMetaData","InstagramPostMetadataInput","PostType"];
          for (const name of names) {
            const d = await gql(q,{name});
            console.log("TYPE",name,JSON.stringify(d.__type));
          }
          NODE
