name: MIO X one-off recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mio-x-one-off.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mio-x-publishing
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: node --check scripts/mio-x-one-off.mjs
      - name: Schedule or recover exact MIO X post
        env:
          # Verified by known historical MIO X post, not by the secret label.
          BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MIO_X_MANIFEST_PATH: automation/mio-x/one-off-2026-09-25.json
        run: node scripts/mio-x-one-off.mjs
