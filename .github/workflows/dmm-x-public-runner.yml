name: DMM X daily batch (PAUSED - paid partnership policy hold)

on:
  workflow_dispatch:

# Safety hold applied 2026-10-28 JST.
# X's official Paid Partnerships Policy includes commission-generating
# affiliate links and excludes adult/sexual products, services and
# entertainment. This mixed batch runner must not create new affiliate
# placements until policy applicability is resolved. Historical code and
# external IDs remain recoverable from git/state; no existing post is deleted.
permissions:
  contents: read

concurrency:
  group: dmm-x-public-runner
  cancel-in-progress: false

jobs:
  policy-hold:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Paused: adult affiliate paid-partnership policy review required."
