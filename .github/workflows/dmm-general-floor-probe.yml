name: Probe DMM general service metadata

# Manual only. This workflow never calls ItemList, Buffer, or production scripts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmm-general-floor-probe
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout only the isolated probe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/dmm-general-floor-probe.py
      - name: Read general DMM.com service and floor metadata once
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
        run: python3 -I -B scripts/dmm-general-floor-probe.py
