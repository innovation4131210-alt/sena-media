name: MIO Instagram October overflow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mio-instagram-overflow
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: node --check scripts/mio-instagram-overflow.mjs
      - name: Schedule exact six MIO posts
        env:
          BUFFER_API_KEY: ${{ secrets.MIO_BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mio-instagram-overflow.mjs
