name: MIO Instagram October overflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mio-instagram-overflow.yml
permissions:
  contents: write
concurrency:
  group: mio-instagram-publishing
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Verify restoration guards before external actions
        run: |
          node --check scripts/mio-instagram-overflow.mjs
          node --check scripts/mio-instagram-transfer-guard.mjs
          node scripts/test-mio-instagram-transfer-guard.mjs
      - name: Restore exact six authorized Buffer-only dates and read back
        env:
          BUFFER_API_KEY: ${{ secrets.MIO_BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mio-instagram-overflow.mjs
