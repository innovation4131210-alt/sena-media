name: SENA 30-day rolling queue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  push:
    branches: [main]
    paths:
      - "media/sena-30day-2026-09-28/**"
      - "automation/30day/publishing-manifest.json"
      - "scripts/sena-30day-rolling-queue.mjs"
      - "scripts/test-sena-30day-rolling-queue.mjs"
      - ".github/workflows/sena-30day-rolling-queue.yml"

permissions:
  contents: write

concurrency:
  group: sena-30day-publishing
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          # The publishing lock is acquired before checkout. A queued push
          # must read state written by the preceding run, not its event SHA.
          ref: main
          fetch-depth: 0
      - name: Test per-channel capacity and duplicate recovery
        run: |
          node --check scripts/sena-30day-rolling-queue.mjs
          node scripts/test-sena-30day-rolling-queue.mjs
      - name: Fill SENA Buffer queue safely
        env:
          BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
        run: node scripts/sena-30day-rolling-queue.mjs
      - name: Persist rolling queue state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/30day/sena-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SENA rolling queue state"
          git pull --rebase origin main
          git push
