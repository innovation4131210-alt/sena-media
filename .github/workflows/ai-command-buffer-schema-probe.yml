name: Probe Buffer analytics schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-command-buffer-schema-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
    steps:
      - name: Introspect analytics fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          API="https://api.buffer.com"
          key=os.environ["BUFFER_API_KEY"]

          def gql(query):
              req=urllib.request.Request(
                  API,
                  data=json.dumps({"query":query}).encode(),
                  headers={"Content-Type":"application/json","Authorization":f"Bearer {key}"},
                  method="POST",
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          query=r"""
          query SchemaProbe {
            metricType: __type(name:"PostMetric") {
              fields { name type { kind name ofType { kind name ofType { kind name } } } }
            }
            metricEnum: __type(name:"PostMetricType") {
              enumValues { name }
            }
            metricUnit: __type(name:"PostMetricUnit") {
              enumValues { name }
            }
            aggInput: __type(name:"AggregatedPostMetricsInput") {
              inputFields { name type { kind name ofType { kind name ofType { kind name } } } }
            }
            queryRoot: __type(name:"Query") {
              fields {
                name
                type { kind name ofType { kind name } }
                args { name type { kind name ofType { kind name } } }
              }
            }
          }
          """
          data=gql(query)["data"]
          print("PostMetric_fields=" + json.dumps(data["metricType"],ensure_ascii=False,separators=(",",":")))
          print("PostMetricType_values=" + json.dumps(data["metricEnum"],ensure_ascii=False,separators=(",",":")))
          print("PostMetricUnit_values=" + json.dumps(data["metricUnit"],ensure_ascii=False,separators=(",",":")))
          print("AggregatedPostMetricsInput=" + json.dumps(data["aggInput"],ensure_ascii=False,separators=(",",":")))
          wanted=[x for x in data["queryRoot"]["fields"] if x["name"] in ("posts","post","aggregatedPostMetrics")]
          print("analytics_queries=" + json.dumps(wanted,ensure_ascii=False,separators=(",",":")))
          PY
