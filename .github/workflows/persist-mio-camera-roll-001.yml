name: Persist MIO camera-roll 001 media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/mio-camera-roll-001-sources.json"
      - ".github/workflows/persist-mio-camera-roll-001.yml"

permissions:
  contents: write

concurrency:
  group: persist-mio-camera-roll-001
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download and persist three source shots
        shell: bash
        run: |
          set -euo pipefail
          DIR="media/camera-roll-v3/mio-camera-roll-001"
          mkdir -p "$DIR"
          python - <<'PY'
          import json, pathlib
          d=json.load(open("ops/mio-camera-roll-001-sources.json"))
          p=pathlib.Path("/tmp/mio-camera-roll-001")
          p.mkdir(parents=True,exist_ok=True)
          for i,u in enumerate(d["sourceUrls"],1):
              (p/f"url-{i}.txt").write_text(u)
          PY
          for N in 1 2 3; do
            URL="$(cat /tmp/mio-camera-roll-001/url-$N.txt)"
            curl --fail --location --retry 4 --silent --show-error "$URL" -o "$DIR/shot-$N.jpg"
            test -s "$DIR/shot-$N.jpg"
          done

      - name: Build six-second camera-roll clip
        shell: bash
        run: |
          set -euo pipefail
          DIR="media/camera-roll-v3/mio-camera-roll-001"
          OUT="media/camera-roll-v3/mio-camera-roll-001.mp4"
          ffmpeg -hide_banner -loglevel warning -y             -loop 1 -framerate 30 -t 2 -i "$DIR/shot-1.jpg"             -loop 1 -framerate 30 -t 2 -i "$DIR/shot-2.jpg"             -loop 1 -framerate 30 -t 2 -i "$DIR/shot-3.jpg"             -filter_complex "[0:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2+4*sin(4*t)':y='(ih-oh)/2+3*sin(3*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v0];[1:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2-3*sin(3*t)':y='(ih-oh)/2+4*sin(4*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v1];[2:v]scale=1120:1992:force_original_aspect_ratio=increase,crop=1080:1920:x='(iw-ow)/2+4*sin(5*t)':y='(ih-oh)/2-3*sin(2*t)',fps=30,setpts=PTS-STARTPTS,setsar=1[v2];[v0][v1][v2]concat=n=3:v=1:a=0,fps=30,settb=1/30,setpts=N,format=yuv420p[v]"             -map "[v]" -an -t 6 -r 30 -fps_mode cfr             -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart "$OUT"

      - name: Validate persisted clip
        shell: bash
        run: |
          set -euo pipefail
          OUT="media/camera-roll-v3/mio-camera-roll-001.mp4"
          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$OUT")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$OUT")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$OUT")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$OUT")"
          awk -v d="$DUR" 'BEGIN { exit !(d >= 5.9 && d <= 6.1) }'
          test "$W" = "1080"
          test "$H" = "1920"
          test "$FPS" = "30/1"
          test "$CODEC" = "h264"
          sha256sum "$OUT" > "media/camera-roll-v3/mio-camera-roll-001.sha256"

      - name: Commit durable public media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             media/camera-roll-v3/mio-camera-roll-001/shot-1.jpg             media/camera-roll-v3/mio-camera-roll-001/shot-2.jpg             media/camera-roll-v3/mio-camera-roll-001/shot-3.jpg             media/camera-roll-v3/mio-camera-roll-001.mp4             media/camera-roll-v3/mio-camera-roll-001.sha256
          if git diff --cached --quiet; then
            echo "Media already current."
            exit 0
          fi
          git commit -m "Persist MIO camera-roll 001 media"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

