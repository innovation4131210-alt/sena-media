name: Retired MIO duplicate cancellation
# Retired 2026-09-24: the historical Metricool IDs are not live reservations.
# The authoritative manifest assigns Oct 22-27 to Buffer. Never cancel these
# replacement posts from an old scheduling-state file or old fixed ID list.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mio-instagram-publishing
  cancel-in-progress: false
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Preserve authoritative Buffer reservations
        run: echo "This historical cancellation is retired. No external mutation is permitted. Read the current publishing manifest and both live schedulers before any new duplicate repair."
