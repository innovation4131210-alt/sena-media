name: DMM X P0 repair once

on:
  workflow_dispatch:
  schedule:
    # One-day safety retries for the 2026-10-02 pre-publish P0 repair.
    # The workflow deletes itself after a successful repair + Buffer readback.
    - cron: "50 10 2 10 *" # 19:50 JST
    - cron: "50 11 2 10 *" # 20:50 JST fallback

permissions:
  contents: write

concurrency:
  group: dmm-x-public-runner
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: One-day gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%F)" = "2026-10-02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repair scheduled generic fallback text in place
        if: steps.gate.outputs.run == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.DMM_BUFFER_API_KEY }}
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          ENABLE_DMM_MEDIA: "false"
        run: python3 automation/dmm-x/buffer_queue.py

      - name: Persist repair state
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          set -e
          if git diff --quiet -- automation/dmm-x/state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/dmm-x/state.json
          git commit -m "chore: record DMM P0 repair state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cooldown before independent Buffer readback
        if: steps.gate.outputs.run == 'true' && success()
        run: sleep 95

      - name: Read back Buffer text
        if: steps.gate.outputs.run == 'true' && success()
        env:
          DMM_BUFFER_API_KEY: ${{ secrets.DMM_BUFFER_API_KEY }}
        run: node scripts/dmm-x-live-audit.mjs

      - name: Persist readback and retire one-shot workflow
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add analytics/dmm-x-live-audit.json
          git rm .github/workflows/dmm-x-p0-repair-once.yml
          git commit -m "ops: verify DMM P0 repair and retire one-shot retry"
          git pull --rebase origin main
          git push origin HEAD:main
