name: Inspect Buffer delete mutation
on:
  push:
    paths:
      - .github/workflows/inspect-buffer-delete.yml
      - scripts/inspect-buffer-delete.mjs
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect exact schema contract
        env:
          BUFFER_API_KEY: ${{ secrets.MIO_BUFFER_API_KEY }}
        run: node scripts/inspect-buffer-delete.mjs
