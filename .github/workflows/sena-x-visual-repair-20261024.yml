name: SENA X one-time visual media repair 2026-10-24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sena-x-visual-repair-20261024.yml"

permissions:
  contents: write

concurrency:
  group: x-buffer-sena-refill
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      X_BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate one-time repair script
        run: node --check scripts/sena-x-visual-repair-20261024.mjs
      - name: Inspect and repair exactly four SENA X media assets in Buffer
        run: node scripts/sena-x-visual-repair-20261024.mjs
      - name: Persist verified SENA queue asset audit
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- automation/x-buffer/sena-queue.json; then
            echo "SENA audit queue did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/x-buffer/sena-queue.json
          git commit -m "Persist read-back verification of SENA X Buffer assets"
          git pull --rebase origin main
          git push
