name: Cancel MIO X text-only reservations once 2026-11-26

on:
  push:
    branches: [main]
    paths:
      - "analytics/mio-x-text-only-cancel-request-2026-11-26.json"

permissions:
  contents: write

concurrency:
  group: mio-x-text-only-cancel-2026-11-26-once
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      X_BUFFER_API_KEY: ${{ secrets.X_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cancel exact text-only scheduled posts and read back
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const requestPath="analytics/mio-x-text-only-cancel-request-2026-11-26.json";
          const resultPath="analytics/mio-x-text-only-cancel-result-2026-11-26.json";
          const req=JSON.parse(await readFile(requestPath,"utf8"));
          const API_URL="https://api.buffer.com";
          const normalize=v=>String(v??"").trim().replace(/^@/,"").toLowerCase();
          async function gql(query,variables={}){
            const key=process.env.X_BUFFER_API_KEY;
            if(!key) throw new Error("X_BUFFER_API_KEY is not configured");
            const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({query,variables}),signal:AbortSignal.timeout(30000)});
            const raw=await response.text();
            let json;try{json=JSON.parse(raw)}catch{throw new Error("Buffer returned non-JSON ("+response.status+"): "+raw.slice(0,300))}
            if(!response.ok||json.errors?.length||!json.data) throw new Error("Buffer API error: "+JSON.stringify(json.errors??json));
            return json.data;
          }
          async function resolveChannel(){
            const account=await gql("query { account { organizations { id name } } }");
            const matches=[];
            for(const organization of account.account?.organizations??[]){
              const data=await gql(`query($organizationId: OrganizationId!) { channels(input:{organizationId:$organizationId}) { id name displayName service isQueuePaused isDisconnected isLocked } }`,{organizationId:organization.id});
              for(const channel of data.channels??[]){
                if(!["twitter","x"].includes(String(channel.service).toLowerCase())) continue;
                if(![channel.name,channel.displayName].some(v=>normalize(v)==="mio_ai_life_jp")) continue;
                matches.push({...channel,organizationId:organization.id});
              }
            }
            if(matches.length!==1) throw new Error("Expected exactly one @mio_ai_life_jp X channel; found "+matches.length);
            const channel=matches[0];
            if(channel.id!==req.channelId) throw new Error("Buffer channel identity mismatch");
            if(channel.isDisconnected||channel.isLocked||channel.isQueuePaused) throw new Error("@mio_ai_life_jp Buffer channel unavailable");
            return channel;
          }
          async function inventory(channel){
            const data=await gql(`query($organizationId: OrganizationId!, $channelId: ChannelId!) { posts(first:100,input:{organizationId:$organizationId,filter:{channelIds:[$channelId]},sort:[{field:dueAt,direction:asc}]}) { edges { node { id text status dueAt sentAt externalLink channelId assets { id mimeType __typename source ... on ImageAsset { image { width height } } } } } pageInfo { hasNextPage } } }`,{organizationId:channel.organizationId,channelId:channel.id});
            const connection=data.posts;
            if(!Array.isArray(connection?.edges)||connection.pageInfo?.hasNextPage!==false) throw new Error("Incomplete Buffer inventory; refusing mutation");
            const rows=connection.edges.map(edge=>edge?.node);
            if(rows.some(row=>!row?.id||row.channelId!==channel.id||typeof row.status!=="string")) throw new Error("Buffer inventory channel or shape mismatch");
            if(new Set(rows.map(row=>row.id)).size!==rows.length) throw new Error("Duplicate Buffer inventory IDs");
            return rows;
          }
          const hasVisual=post=>Array.isArray(post?.assets)&&post.assets.some(asset=>/^(image|video)\//i.test(String(asset?.mimeType??""))&&(Boolean(asset?.id)||(asset?.__typename==="ImageAsset"&&/^https:\/\//.test(String(asset.source??""))&&Number(asset.image?.width)>0&&Number(asset.image?.height)>0)));
          async function del(id){
            const data=await gql(`mutation DeletePost($input: DeletePostInput!) { deletePost(input:$input) { __typename ... on DeletePostSuccess { id } } }`,{input:{id}});
            if(data.deletePost?.__typename!=="DeletePostSuccess"||data.deletePost?.id!==id) throw new Error("Buffer deletePost failed for "+id+": "+JSON.stringify(data.deletePost));
            return data.deletePost.id;
          }
          let result={version:1,request:req,startedAt:new Date().toISOString(),results:[],allRemoved:false};
          try{
            const channel=await resolveChannel();
            const before=await inventory(channel);
            const requested=new Set(req.bufferPostIds);
            const otherTextOnly=before.filter(p=>p.status==="scheduled"&&!hasVisual(p)&&!requested.has(p.id));
            if(otherTextOnly.length) throw new Error("Unrequested text-only scheduled posts also exist: "+otherTextOnly.map(p=>p.id).join(","));
            const planned=[];
            for(const id of req.bufferPostIds){
              const post=before.find(p=>p.id===id);
              if(!post){result.results.push({id,action:"already_absent",ok:true});continue}
              if(post.status!=="scheduled") throw new Error("Requested post is not scheduled: "+id+" status="+post.status);
              if(hasVisual(post)) throw new Error("Requested post now has a visual asset; refusing deletion: "+id);
              planned.push({id,dueAt:post.dueAt,text:post.text});
            }
            for(const post of planned){
              const deletedId=await del(post.id);
              result.results.push({id:post.id,action:"deleted_exact_text_only_scheduled_post",ok:true,deletedId,dueAt:post.dueAt,text:post.text});
            }
            const after=await inventory(channel);
            const remaining=after.filter(p=>requested.has(p.id)||p.status==="scheduled"&&!hasVisual(p));
            if(remaining.length) throw new Error("Post-removal readback still contains text-only/requested IDs: "+remaining.map(p=>p.id).join(","));
            result.allRemoved=true;result.readbackVerified=true;result.completedAt=new Date().toISOString();result.noReplacement=true;result.noCatchup=true;result.noOtherPostMutation=true;
            await writeFile(resultPath,JSON.stringify(result,null,2)+"\n");
          }catch(error){
            result.error=String(error?.stack??error);result.completedAt=new Date().toISOString();
            await writeFile(resultPath,JSON.stringify(result,null,2)+"\n");
            process.exitCode=1;
          }
          NODE
      - name: Persist result and remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/mio-x-text-only-cancel-request-2026-11-26.json
          if [ -f analytics/mio-x-text-only-cancel-result-2026-11-26.json ]; then
            git add analytics/mio-x-text-only-cancel-result-2026-11-26.json
          fi
          git rm .github/workflows/mio-x-text-only-cancel-2026-11-26-once.yml
          git commit -m "Record MIO X text-only reservation cleanup 2026-11-26"
          git pull --rebase origin main
          git push
