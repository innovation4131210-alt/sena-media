name: Schedule MIO X strong A01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/mio-x/strong-60-a01.json"
      - "scripts/mio-x-strong-a01.mjs"
      - ".github/workflows/mio-x-strong-a01.yml"

permissions:
  contents: write

concurrency:
  group: mio-x-strong-a01
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SENA_BUFFER_API_KEY: ${{ secrets.SENA_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/mio-x-strong-a01.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/mio-x-strong-a01-readback.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify MIO X strong A01 reservation"
          git pull --rebase origin main
          git push
