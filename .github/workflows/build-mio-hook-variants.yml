name: Build MIO hook replication assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/build-mio-hook-variants.txt"

permissions:
  contents: write

concurrency:
  group: build-mio-hook-variants
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build two opening-hook variants
        shell: bash
        run: |
          set -euo pipefail
          build_variant() {
            SRC="$1"
            OUT="$2"
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$SRC")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$SRC")"
            ffmpeg -y -i "$SRC" -filter_complex \
              "[0:v]split=2[a][b]; \
               [a]trim=start=0:end=0.8,setpts=PTS-STARTPTS,crop=iw/1.08:ih/1.08:(iw-ow)/2:(ih-oh)/2,scale=${W}:${H},setsar=1[first]; \
               [b]trim=start=0.8,setpts=PTS-STARTPTS,setsar=1[rest]; \
               [first][rest]concat=n=2:v=1:a=0[v]" \
              -map "[v]" -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart "$OUT"
            test -s "$OUT"
          }

          build_variant "media/mio-ig-growth-002.mp4" "media/mio-hook-003.mp4"
          build_variant "media/mio-ig-growth-003.mp4" "media/mio-hook-004.mp4"

          ffprobe -v error -show_entries format=duration,size -of json media/mio-hook-003.mp4
          ffprobe -v error -show_entries format=duration,size -of json media/mio-hook-004.mp4

      - name: Persist durable media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/mio-hook-003.mp4 media/mio-hook-004.mp4
          if git diff --cached --quiet; then
            echo "Assets already current."
            exit 0
          fi
          git commit -m "Add MIO hook replication assets"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
