name: Audit DMM actress popularity

on:
  workflow_dispatch:
  schedule:
    # Refresh performer popularity before the 06:00 JST DMM queue refill.
    - cron: "25 20 * * *"
  push:
    branches: [main]
    paths:
      - "automation/dmm-x/audit_actress_popularity.py"
      - "automation/dmm-x/preview_selection.py"
      - "automation/dmm-x/buffer_queue.py"
      - ".github/workflows/dmm-x-actress-popularity.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Audit current DMM actress popularity proxy
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          BUFFER_API_KEY: ${{ secrets.DMM_BUFFER_API_KEY }}
        run: |
          python3 -m py_compile automation/dmm-x/audit_actress_popularity.py
          python3 -m py_compile automation/dmm-x/preview_selection.py
          cd automation/dmm-x
          python3 audit_actress_popularity.py
          python3 preview_selection.py
          cd ../..
      - name: Persist audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/dmm-actress-popularity.json analytics/dmm-selection-preview.json
          if git diff --cached --quiet; then
            echo "No new actress audit payload; nothing to push."
            exit 0
          fi
          expected_popularity_hash="$(sha256sum analytics/dmm-actress-popularity.json | cut -d' ' -f1)"
          expected_preview_hash="$(sha256sum analytics/dmm-selection-preview.json | cut -d' ' -f1)"
          git commit -m "Record DMM actress popularity audit"

          # Rebase alone does not persist. Retry only Git pushes, never the DMM/Buffer read.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              git fetch origin main
              remote_popularity_hash="$(git show origin/main:analytics/dmm-actress-popularity.json | sha256sum | cut -d' ' -f1)"
              remote_preview_hash="$(git show origin/main:analytics/dmm-selection-preview.json | sha256sum | cut -d' ' -f1)"
              if [ "$remote_popularity_hash" = "$expected_popularity_hash" ] && [ "$remote_preview_hash" = "$expected_preview_hash" ]; then
                echo "Actress audit and selection preview persistence verified on main."
                exit 0
              fi
              echo "::error::GitHub main does not contain this actress audit payload." >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Git push failed; preserve collected JSON without repeating API reads." >&2
          exit 1

      - name: Preserve actress audit payload if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dmm-actress-audit-payload-${{ github.run_id }}
          path: |
            analytics/dmm-actress-popularity.json
            analytics/dmm-selection-preview.json
          retention-days: 14
          if-no-files-found: warn
