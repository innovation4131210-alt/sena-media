name: DMM X live Buffer audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/dmm-x-live-audit.mjs"
      - "automation/dmm-x/buffer_queue.py"
      - ".github/workflows/dmm-x-live-audit.yml"
  schedule:
    # Read-only snapshots every 6 hours for faster feedback loops.
    - cron: "45 20 * * *" # 05:45 JST
    - cron: "20 21 * * *" # 06:20 JST; post-run Buffer readback for newly generated daily batch
    - cron: "45 2 * * *"  # 11:45 JST
    - cron: "45 8 * * *"  # 17:45 JST
    - cron: "45 14 * * *" # 23:45 JST

permissions:
  contents: write

concurrency:
  group: dmm-x-live-buffer-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate DMM scripts
        run: |
          node --check scripts/dmm-x-live-audit.mjs
          python3 -m py_compile automation/dmm-x/buffer_queue.py
      - name: Read DMM X Buffer state and metrics
        env:
          DMM_BUFFER_API_KEY: ${{ secrets.DMM_BUFFER_API_KEY }}
        run: node scripts/dmm-x-live-audit.mjs
      - name: Persist credential-free audit
        run: |
          set -euo pipefail
          test -f analytics/dmm-x-live-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit exactly once; a successful rebase must still be followed by a push.
          git add analytics/dmm-x-live-audit.json
          if git diff --cached --quiet; then
            echo "No new audit payload (e.g. persisted Buffer cooldown); nothing to push."
            exit 0
          fi
          expected_checked_at="$(python3 -c 'import json; print(json.load(open("analytics/dmm-x-live-audit.json", encoding="utf-8"))["checkedAt"])')"
          expected_updated_at="$(python3 -c 'import json; print(json.load(open("analytics/dmm-x-live-audit.json", encoding="utf-8"))["updatedAt"])')"
          git commit -m "Record DMM X live Buffer audit"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              # Job success requires confirmation that main contains THIS read.
              git fetch origin main
              if git show origin/main:analytics/dmm-x-live-audit.json | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("checkedAt")==sys.argv[1] and d.get("updatedAt")==sys.argv[2] else 1)' "$expected_checked_at" "$expected_updated_at"; then
                echo "Audit persistence verified: checkedAt=$expected_checked_at updatedAt=$expected_updated_at"
                exit 0
              fi
              echo "::error::GitHub main does not contain this Buffer audit; read and persistence are separate." >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Git push failed; preserve the read payload without re-querying Buffer." >&2
          exit 1

      - name: Preserve audit payload if GitHub persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dmm-x-audit-payload-${{ github.run_id }}
          path: analytics/dmm-x-live-audit.json
          retention-days: 14
          if-no-files-found: warn
